name: Build Singularity images

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full comparison (ignore recent-days filter)"
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - '3.12'
        apptainer-version:
          - 'latest'
    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}_Python-${{ matrix.python-version }}_Apptainer-${{ matrix.apptainer-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --requirement requirements.in
      - name: Fetch images and generate build script
        run: |
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            ./populate_build.py --recent-days 0
          else
            ./populate_build.py
          fi
      - name: Set up Apptainer ${{ matrix.apptainer-version }}
        uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: ${{ matrix.apptainer-version }}
      - name: Build images
        run: |
          echo "${{ secrets.DEPOT_GALAXYPROJECT_ORG }}" > ssh_key && chmod 600 ssh_key
          ./build.sh
